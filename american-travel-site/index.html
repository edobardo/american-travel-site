<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e85d04;
            --primary-dark: #d00000;
            --secondary: #0077b6;
            --accent: #ffba08;
            --bg-dark: #0d1b2a;
            --bg-card: #1b263b;
            --bg-sidebar: #0f1c2e;
            --text: #e0e1dd;
            --text-muted: #778da9;
            --border: #415a77;
            --success: #2a9d8f;
            --danger: #e63946;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .header-icon {
            width: 50px;
            height: 50px;
            margin-right: 15px;
            vertical-align: middle;
        }

        /* SIDEBAR */
        .sidebar {
            width: 35%;
            min-width: 340px;
            max-width: 480px;
            background: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            z-index: 10;
        }

        .sidebar-header {
            padding: 24px 20px 16px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, var(--bg-sidebar) 0%, var(--bg-card) 100%);
        }

        .sidebar-header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .sidebar-header .subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .sidebar-header .badge {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 10px;
            background: var(--primary);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sidebar-filters {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .filter-chip:hover { border-color: var(--primary); }
        .filter-chip.active { background: var(--primary); border-color: var(--primary); color: white; }
        .filter-chip input { display: none; }

        .days-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px 20px;
        }

        .days-list::-webkit-scrollbar { width: 6px; }
        .days-list::-webkit-scrollbar-track { background: transparent; }
        .days-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .day-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 10px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .day-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: var(--primary);
            border-radius: 14px 0 0 14px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .day-card:hover {
            transform: translateX(4px);
            border-color: var(--primary);
            box-shadow: var(--shadow);
        }

        .day-card:hover::before { opacity: 1; }
        .day-card.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(255,186,8,0.15), var(--shadow);
        }
        .day-card.active::before { opacity: 1; background: var(--accent); }

        .day-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .day-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: var(--primary);
            color: white;
            font-weight: 800;
            font-size: 0.85rem;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .day-card.active .day-number { background: var(--accent); color: var(--bg-dark); }

        .day-title-group { flex: 1; margin-left: 12px; }
        .day-title { font-size: 0.95rem; font-weight: 700; color: var(--text); line-height: 1.3; }
        .day-route { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }

        .day-tags {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .tag-attr { background: rgba(232,93,4,0.15); color: #ff9f43; }
        .tag-camp { background: rgba(42,157,143,0.15); color: #2a9d8f; }
        .tag-drive { background: rgba(119,141,169,0.15); color: var(--text-muted); }

        .day-details {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            display: none;
        }

        .day-card.active .day-details { display: block; }

        .detail-section { margin-bottom: 10px; }
        .detail-section:last-child { margin-bottom: 0; }
        .detail-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .detail-list {
            font-size: 0.8rem;
            color: var(--text);
            line-height: 1.6;
            padding-left: 14px;
        }
        .detail-list li { margin-bottom: 2px; }

        .btn-maps {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 8px 14px;
            background: var(--secondary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-maps:hover { background: #005f8a; }

        /* MAP */
        .map-wrapper {
            flex: 1;
            position: relative;
            background: #1a1a2e;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* LEGEND OVERLAY */
        .legend-panel {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: rgba(13, 27, 42, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            z-index: 5;
            box-shadow: var(--shadow);
            min-width: 220px;
        }

        .legend-title {
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: var(--text);
            margin-bottom: 7px;
        }
        .legend-item:last-child { margin-bottom: 0; }

        .legend-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 800;
            color: white;
        }
        .legend-stop { background: var(--danger); }
        .legend-camp { background: var(--success); }
        .legend-line {
            width: 24px;
            height: 3px;
            background: var(--primary);
            border-radius: 2px;
            opacity: 0.8;
        }

        /* STATS BAR */
        .stats-bar {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            background: rgba(13, 27, 42, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 20px;
            z-index: 5;
            box-shadow: var(--shadow);
        }

        .stat-item { text-align: center; }
        .stat-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent);
        }
        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* MOBILE DRAWER */
        .mobile-toggle {
            display: none;
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 6;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        /* INFO WINDOW CUSTOM */
        .gm-style .gm-style-iw-c {
            background: var(--bg-card) !important;
            color: var(--text) !important;
            border-radius: 14px !important;
            padding: 0 !important;
            box-shadow: var(--shadow) !important;
            border: 1px solid var(--border) !important;
        }
        .gm-style .gm-style-iw-d { overflow: hidden !important; padding: 0 !important; }
        .gm-style .gm-style-iw-t::after { background: var(--bg-card) !important; }
        .gm-style .gm-ui-hover-effect { filter: invert(1) !important; opacity: 0.7 !important; }

        .iw-content {
            padding: 14px 16px;
            max-width: 280px;
        }
        .iw-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 2px;
        }
        .iw-day {
            font-size: 0.7rem;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .iw-section { margin-bottom: 8px; }
        .iw-section-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }
        .iw-list {
            font-size: 0.78rem;
            color: var(--text);
            line-height: 1.5;
            padding-left: 14px;
            margin: 0;
        }
        .iw-list li { margin-bottom: 1px; }
        .iw-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 8px;
            font-size: 0.75rem;
            color: var(--secondary);
            text-decoration: none;
            font-weight: 600;
        }
        .iw-link:hover { text-decoration: underline; }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .app-container { flex-direction: column; }
            .sidebar {
                width: 100%;
                max-width: none;
                min-width: auto;
                position: fixed;
                bottom: 0;
                left: 0; right: 0;
                height: 55vh;
                border-right: none;
                border-top: 1px solid var(--border);
                border-radius: 20px 20px 0 0;
                transform: translateY(calc(100% - 56px));
                transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .sidebar.open { transform: translateY(0); }
            .sidebar-header { padding: 16px 16px 12px; }
            .days-list { padding: 8px 12px 16px; }
            .map-wrapper { height: 100vh; }
            .mobile-toggle { display: block; }
            .legend-panel {
                bottom: 80px;
                right: 12px;
                left: 12px;
                min-width: auto;
            }
            .stats-bar {
                top: 10px;
                gap: 12px;
                padding: 8px 14px;
            }
        }

        /* LOADING */
        .map-loader {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
            z-index: 20;
            transition: opacity 0.5s;
        }
        .map-loader.hidden { opacity: 0; pointer-events: none; }
        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text {
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>

                <div style="font-size:0.8rem;color:var(--text-muted);line-height:1.5;">
                    Modifica la costante <code style="background:var(--bg-card);padding:2px 6px;border-radius:4px;">GOOGLE_MAPS_API_KEY</code>
                    nel codice sorgente con la tua chiave Google Maps.<br><br>
                    <a href="https://developers.google.com/maps/documentation/javascript/get-api-key" target="_blank" style="color:var(--secondary);">Ottieni una chiave gratuita →</a>
                </div>
            </div>
        `;
        return;
    }

    const script = document.createElement('script');
    script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&callback=initMap`;
    script.async = true;
    script.defer = true;
    script.onerror = () => {
        document.getElementById('mapLoader').innerHTML = `
            <div style="text-align:center;color:var(--danger);">
                <div style="font-size:2rem;margin-bottom:8px;">⚠️</div>
                <div>Errore caricamento Google Maps.<br>Verifica la tua API Key.</div>
            </div>
        `;
    };
    document.head.appendChild(script);
}

function initMap() {
    map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 36.5, lng: -115 },
        zoom: 6,
        mapTypeId: 'hybrid',
        mapTypeControl: true,
        mapTypeControlOptions: {
            position: google.maps.ControlPosition.TOP_LEFT,
            style: google.maps.MapTypeControlStyle.DEFAULT
        },
        fullscreenControl: true,
        streetViewControl: false,
        zoomControl: true,
        zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER },
        styles: [
            { elementType: 'labels.text.fill', stylers: [{ color: '#e0e1dd' }] },
            { elementType: 'labels.text.stroke', stylers: [{ color: '#0d1b2a' }] }
        ]
    });

    buildRoute();
    buildMarkers();
    fitBounds();

    document.getElementById('mapLoader').classList.add('hidden');
}

/* ═══════════════════════════════════════════════════════════════
   ROUTE (Polyline)
   ═══════════════════════════════════════════════════════════════ */
function buildRoute() {
    const path = itinerary.map(d => d.coords);
    polyline = new google.maps.Polyline({
        path: path,
        geodesic: true,
        strokeColor: '#e85d04',
        strokeOpacity: 0.8,
        strokeWeight: 4,
        map: map
    });
}

/* ═══════════════════════════════════════════════════════════════
   MARKERS
   ═══════════════════════════════════════════════════════════════ */
function buildMarkers() {
    itinerary.forEach((day, idx) => {
        // Main stop marker
        const stopMarker = new google.maps.Marker({
            position: day.coords,
            map: map,
            title: `Giorno ${day.day}: ${day.title}`,
            icon: createNumberedPin(day.day, '#e63946'),
            zIndex: 100 + idx
        });

        const stopIW = new google.maps.InfoWindow({
            content: buildInfoWindowContent(day, 'stop')
        });

        stopMarker.addListener('click', () => {
            closeAllInfoWindows();
            stopIW.open(map, stopMarker);
            highlightDay(day.day);
        });

        markers.push({ marker: stopMarker, type: 'attraction', day: day.day });
        infoWindows.push(stopIW);

        // Camping marker
        if (day.campingCoords) {
            const campMarker = new google.maps.Marker({
                position: day.campingCoords,
                map: map,
                title: `Campeggio Giorno ${day.day}`,
                icon: createCampingPin(),
                zIndex: 50 + idx
            });

            const campIW = new google.maps.InfoWindow({
                content: buildInfoWindowContent(day, 'camp')
            });

            campMarker.addListener('click', () => {
                closeAllInfoWindows();
                campIW.open(map, campMarker);
                highlightDay(day.day);
            });

            markers.push({ marker: campMarker, type: 'camping', day: day.day });
            infoWindows.push(campIW);
        }
    });
}

function createNumberedPin(number, color) {
    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="48" viewBox="0 0 36 48">
            <path d="M18 0C8.06 0 0 8.06 0 18c0 13.5 18 30 18 30s18-16.5 18-30C36 8.06 27.94 0 18 0z" fill="${color}"/>
            <circle cx="18" cy="18" r="14" fill="white"/>
            <text x="18" y="23" text-anchor="middle" font-size="14" font-weight="800" fill="${color}">${number}</text>
        </svg>
    `;
    return {
        url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
        scaledSize: new google.maps.Size(36, 48),
        anchor: new google.maps.Point(18, 48),
        labelOrigin: new google.maps.Point(18, 18)
    };
}

function createCampingPin() {
    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="15" fill="#2a9d8f" stroke="white" stroke-width="2"/>
            <text x="16" y="21" text-anchor="middle" font-size="14">⛺</text>
        </svg>
    `;
    return {
        url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
        scaledSize: new google.maps.Size(32, 32),
        anchor: new google.maps.Point(16, 16)
    };
}

function buildInfoWindowContent(day, type) {
    const isCamp = type === 'camp';
    const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${day.coords.lat},${day.coords.lng}`;

    let content = `<div class="iw-content">`;
    content += `<div class="iw-day">Giorno ${day.day}</div>`;
    content += `<div class="iw-title">${isCamp ? '⛺ ' + day.title : day.title}</div>`;

    if (!isCamp && day.attractions && day.attractions.length) {
        content += `<div class="iw-section"><div class="iw-section-title">🎯 Da vedere</div><ul class="iw-list">`;
        day.attractions.forEach(a => content += `<li>${a}</li>`);
        content += `</ul></div>`;
    }

    if (day.camping) {
        content += `<div class="iw-section"><div class="iw-section-title">⛺ Dove dormire</div><ul class="iw-list"><li>${day.camping}</li></ul></div>`;
    }

    if (day.driveTime) {
        content += `<div class="iw-section"><div class="iw-section-title">🚗 Guida</div><div style="font-size:0.78rem;color:var(--text);">${day.driveTime}</div></div>`;
    }

    content += `<a class="iw-link" href="${mapsUrl}" target="_blank" rel="noopener">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Apri indicazioni su Google Maps
    </a>`;

    content += `</div>`;
    return content;
}

function closeAllInfoWindows() {
    infoWindows.forEach(iw => iw.close());
}

function fitBounds() {
    const bounds = new google.maps.LatLngBounds();
    itinerary.forEach(d => {
        bounds.extend(d.coords);
        if (d.campingCoords) bounds.extend(d.campingCoords);
    });
    map.fitBounds(bounds, { top: 60, right: 40, bottom: 40, left: 40 });
}

/* ═══════════════════════════════════════════════════════════════
   SIDEBAR
   ═══════════════════════════════════════════════════════════════ */
function renderSidebar() {
    const container = document.getElementById('daysList');
    container.innerHTML = itinerary.map(day => `
        <div class="day-card" id="day-${day.day}" onclick="selectDay(${day.day})">
            <div class="day-card-header">
                <div class="day-number">${day.day}</div>
                <div class="day-title-group">
                    <div class="day-title">${day.title}</div>
                    ${day.driveTime ? `<div class="day-route">🚗 ${day.driveTime}</div>` : ''}
                </div>
            </div>
            <div class="day-tags">
                <span class="tag tag-attr">${day.attractions.length} attrazioni</span>
                <span class="tag tag-camp">⛺ camping</span>
                ${day.driveTime ? '<span class="tag tag-drive">on the road</span>' : ''}
            </div>
            <div class="day-details">
                <div class="detail-section">
                    <div class="detail-label">🎯 Da vedere</div>
                    <ul class="detail-list">
                        ${day.attractions.map(a => `<li>${a}</li>`).join('')}
                    </ul>
                </div>
                <div class="detail-section">
                    <div class="detail-label">⛺ Dove dormire</div>
                    <ul class="detail-list">
                        <li>${day.camping}</li>
                    </ul>
                </div>
                <a class="btn-maps" href="https://www.google.com/maps/dir/?api=1&destination=${day.coords.lat},${day.coords.lng}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    Apri su Google Maps
                </a>
            </div>
        </div>
    `).join('');
}

function selectDay(dayNum) {
    const day = itinerary.find(d => d.day === dayNum);
    if (!day || !map) return;

    highlightDay(dayNum);

    // Pan & zoom
    map.panTo(day.coords);
    map.setZoom(11);

    // Open info window for main marker
    const markerEntry = markers.find(m => m.day === dayNum && m.type === 'attraction');
    if (markerEntry) {
        const iw = infoWindows.find((_, i) => markers[i] === markerEntry);
        if (iw) {
            closeAllInfoWindows();
            iw.open(map, markerEntry.marker);
        }
    }

    // On mobile, close sidebar after selection
    if (window.innerWidth <= 900) {
        document.getElementById('sidebar').classList.remove('open');
    }
}

function highlightDay(dayNum) {
    document.querySelectorAll('.day-card').forEach(el => el.classList.remove('active'));
    const el = document.getElementById(`day-${dayNum}`);
    if (el) {
        el.classList.add('active');
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    activeDay = dayNum;
}

/* ═══════════════════════════════════════════════════════════════
   FILTERS
   ═══════════════════════════════════════════════════════════════ */
function toggleFilter(chip, filterType) {
    const checkbox = chip.querySelector('input');
    checkbox.checked = !checkbox.checked;
    chip.classList.toggle('active', checkbox.checked);
    filters[filterType] = checkbox.checked;
    applyFilters();
}

function applyFilters() {
    if (!map) return;

    // Route
    if (polyline) polyline.setMap(filters.route ? map : null);

    // Markers
    markers.forEach(({ marker, type }) => {
        const show = type === 'camping' ? filters.camping : filters.attractions;
        marker.setMap(show ? map : null);
    });
}

/* ═══════════════════════════════════════════════════════════════
   MOBILE
   ═══════════════════════════════════════════════════════════════ */
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}

/* ═══════════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', initApp);
</script>
