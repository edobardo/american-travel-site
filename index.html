<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/png" href="favicon.png">
<title>USA Road Trip 2027 — West Coast</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
@property --g { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
:root {
  --p: #f48c06; --pg: rgba(244,140,6,.35); --pd: #e85d04;
  --s: #00b4d8; --a: #ffba08; --ag: rgba(255,186,8,.3);
  --bg: #0a0e17; --card: #111827; --ch: #1a2236; --sb: #0d1117;
  --glass: rgba(13,17,23,.85); --t: #f0f2f5; --tm: #8b9bb4;
  --b: rgba(65,90,119,.4); --bh: rgba(244,140,6,.5);
  --ok: #2ec4b6; --ko: #ef476f;
  --sh: 0 8px 32px rgba(0,0,0,.5); --sg: 0 0 40px rgba(244,140,6,.15);
  --sw: clamp(360px,34vw,480px); --r: 16px; --rs: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--t); overflow:hidden; height:100vh; width:100vw; touch-action:manipulation; }
.app-container { display:flex; height:100vh; width:100vw; position:relative; }
.app-container::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse 80% 60% at 20% 40%,rgba(244,140,6,.08) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 80% 60%,rgba(239,71,111,.06) 0%,transparent 50%),radial-gradient(ellipse 50% 40% at 50% 100%,rgba(0,180,216,.05) 0%,transparent 50%); pointer-events:none; z-index:0; animation:bgP 12s ease-in-out infinite alternate; }
@keyframes bgP { 0%{opacity:.6} 100%{opacity:1} }

/* Sidebar */
.sidebar { width:var(--sw); background:var(--sb); display:flex; flex-direction:column; border-right:1px solid var(--b); z-index:10; flex-shrink:0; transition:transform .4s cubic-bezier(.22,1,.36,1); position:relative; overflow:hidden; }
.sidebar::after { content:''; position:absolute; top:0; left:0; right:0; height:200px; background:linear-gradient(180deg,rgba(244,140,6,.08),transparent); pointer-events:none; z-index:0; }
.sidebar-header { padding:22px 20px 16px; border-bottom:1px solid var(--b); background:linear-gradient(135deg,rgba(13,17,23,.95),rgba(17,24,39,.95)); display:flex; align-items:center; gap:14px; position:relative; z-index:1; backdrop-filter:blur(20px); }
.header-icon-wrap { position:relative; flex-shrink:0; }
.header-icon { width:48px; height:48px; border-radius:14px; object-fit:cover; box-shadow:0 4px 16px rgba(244,140,6,.25); border:2px solid rgba(255,255,255,.08); }
.header-icon-glow { position:absolute; inset:-4px; border-radius:18px; background:linear-gradient(135deg,var(--p),var(--ko)); opacity:.3; filter:blur(12px); z-index:-1; animation:iG 3s ease-in-out infinite alternate; }
@keyframes iG { 0%{opacity:.2;transform:scale(.95)} 100%{opacity:.4;transform:scale(1.05)} }
.sidebar-header-text { min-width:0; }
.sidebar-header h1 { font-family:'Space Grotesk',sans-serif; font-size:clamp(1.15rem,1.3vw,1.45rem); font-weight:700; color:var(--t); letter-spacing:-.3px; line-height:1.15; }
.sidebar-header h1 span { background:linear-gradient(135deg,var(--a),var(--p)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.sidebar-header .subtitle { font-size:.76rem; color:var(--tm); font-weight:400; margin-top:4px; letter-spacing:.2px; }
.sidebar-header .badge { display:inline-flex; align-items:center; gap:5px; margin-top:8px; padding:4px 12px; background:linear-gradient(135deg,var(--pd),var(--p)); color:#fff; font-size:.65rem; font-weight:700; border-radius:20px; text-transform:uppercase; letter-spacing:.8px; box-shadow:0 2px 12px rgba(244,140,6,.3); }

/* Progress */
.trip-progress { padding:14px 20px 10px; border-bottom:1px solid var(--b); background:rgba(17,24,39,.5); backdrop-filter:blur(10px); position:relative; z-index:1; }
.progress-label { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.progress-label span { font-size:.68rem; font-weight:600; color:var(--tm); text-transform:uppercase; letter-spacing:.8px; }
.progress-label .pd { font-size:.72rem; font-weight:700; color:var(--a); }
.progress-track { height:5px; background:rgba(65,90,119,.3); border-radius:10px; overflow:hidden; position:relative; }
.progress-fill { height:100%; width:0%; background:linear-gradient(90deg,var(--p),var(--a)); border-radius:10px; transition:width .8s cubic-bezier(.22,1,.36,1); box-shadow:0 0 12px rgba(244,140,6,.4); position:relative; }
.progress-fill::after { content:''; position:absolute; right:0; top:0; bottom:0; width:20px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.4)); border-radius:0 10px 10px 0; }

/* Filters */
.sidebar-filters { padding:14px 16px; border-bottom:1px solid var(--b); display:flex; gap:8px; flex-wrap:wrap; position:relative; z-index:1; background:rgba(13,17,23,.6); }
.filter-chip { display:flex; align-items:center; gap:6px; padding:7px 14px; background:rgba(65,90,119,.15); border:1px solid var(--b); border-radius:24px; font-size:.74rem; font-weight:500; color:var(--tm); cursor:pointer; transition:all .25s cubic-bezier(.22,1,.36,1); user-select:none; white-space:nowrap; position:relative; overflow:hidden; }
.filter-chip::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,var(--p),var(--pd)); opacity:0; transition:opacity .25s; z-index:-1; }
.filter-chip:hover { border-color:var(--bh); color:var(--t); transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.2); }
.filter-chip.active { border-color:transparent; color:#fff; box-shadow:0 2px 12px rgba(244,140,6,.3); }
.filter-chip.active::before { opacity:1; }
.filter-chip input { display:none; }
.filter-chip svg { width:14px; height:14px; opacity:.8; }

/* Days */
.days-list { flex:1; overflow-y:auto; padding:14px 14px 24px; overscroll-behavior:contain; position:relative; z-index:1; }
.days-list::-webkit-scrollbar { width:4px; }
.days-list::-webkit-scrollbar-track { background:transparent; }
.days-list::-webkit-scrollbar-thumb { background:rgba(65,90,119,.4); border-radius:4px; }
.days-list::-webkit-scrollbar-thumb:hover { background:rgba(65,90,119,.7); }

/* Card with image */
.day-card { background:var(--card); border:1px solid var(--b); border-radius:var(--r); margin-bottom:12px; cursor:pointer; transition:all .35s cubic-bezier(.22,1,.36,1); position:relative; overflow:hidden; opacity:0; transform:translateY(12px); animation:cE .5s cubic-bezier(.22,1,.36,1) forwards; }
@keyframes cE { to { opacity:1; transform:translateY(0); } }
.day-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:linear-gradient(180deg,var(--p),var(--a)); border-radius:var(--r) 0 0 var(--r); opacity:0; transition:opacity .3s; z-index:3; }
.day-card:hover { transform:translateX(4px) translateY(-2px); border-color:var(--bh); box-shadow:var(--sh),var(--sg); }
.day-card:hover::before { opacity:1; }
.day-card.active { border-color:var(--a); box-shadow:0 0 0 1px rgba(255,186,8,.2),var(--sh),0 0 40px rgba(255,186,8,.08); transform:translateX(4px); }
.day-card.active::before { opacity:1; background:linear-gradient(180deg,var(--a),var(--p)); }

.day-card-image-wrap { position:relative; height:140px; overflow:hidden; border-radius:var(--r) var(--r) 0 0; }
.day-card-image { width:100%; height:100%; object-fit:cover; transition:transform .6s cubic-bezier(.22,1,.36,1); }
.day-card:hover .day-card-image { transform:scale(1.08); }
.day-card-image-overlay { position:absolute; inset:0; background:linear-gradient(90deg,rgba(10,14,23,.99) 5%,rgba(10,14,23,.65) 35%,rgba(10,14,23,.30) 65%,transparent 100%); z-index:1; }
.day-card-image-top { position:absolute; top:12px; left:14px; z-index:2; display:flex; align-items:center; gap:8px; }
.day-number-badge { display:flex; align-items:center; justify-content:center; width:32px; height:32px; background:linear-gradient(135deg,var(--pd),var(--p)); color:#fff; font-weight:800; font-size:.82rem; border-radius:10px; box-shadow:0 2px 8px rgba(244,140,6,.3); position:relative; overflow:hidden; }
.day-number-badge::after { content:''; position:absolute; top:0; left:0; right:0; height:50%; background:linear-gradient(180deg,rgba(255,255,255,.15),transparent); }
.day-card.active .day-number-badge { background:linear-gradient(135deg,var(--a),#ff9f1c); color:var(--bg); box-shadow:0 2px 12px rgba(255,186,8,.4); }
.day-card-image-bottom { position:absolute; bottom:12px; left:14px; right:14px; z-index:2; }
.day-card-image-bottom .day-title { font-family:'Space Grotesk',sans-serif; font-size:1rem; font-weight:700; color:#fff; line-height:1.2; letter-spacing:-.2px; text-shadow:0 2px 8px rgba(0,0,0,.6); }
.day-card-image-bottom .day-route { display:flex; align-items:center; gap:5px; font-size:.72rem; color:rgba(255,255,255,.85); margin-top:4px; font-weight:500; text-shadow:0 1px 4px rgba(0,0,0,.5); }
.day-card-image-bottom .day-route svg { width:12px; height:12px; opacity:.8; }

.day-card-body { padding:12px 14px 14px; }
.day-tags { display:flex; gap:6px; flex-wrap:wrap; }
.tag { font-size:.6rem; padding:4px 10px; border-radius:8px; font-weight:600; text-transform:uppercase; letter-spacing:.4px; border:1px solid transparent; transition:all .2s; }
.tag-attr { background:rgba(244,140,6,.1); color:#ffb703; border-color:rgba(244,140,6,.2); }
.tag-camp { background:rgba(46,196,182,.1); color:var(--ok); border-color:rgba(46,196,182,.2); }
.tag-drive { background:rgba(139,155,180,.1); color:var(--tm); border-color:rgba(139,155,180,.15); }

.day-details { margin-top:12px; padding-top:12px; border-top:1px solid var(--b); display:none; animation:dR .35s cubic-bezier(.22,1,.36,1); }
@keyframes dR { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
.day-card.active .day-details { display:block; }
.detail-section { margin-bottom:12px; }
.detail-section:last-child { margin-bottom:0; }
.detail-label { display:flex; align-items:center; gap:6px; font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--tm); margin-bottom:6px; }
.detail-label svg { width:13px; height:13px; opacity:.7; }
.detail-list { font-size:.78rem; color:var(--t); line-height:1.7; padding-left:18px; list-style:none; }
.detail-list li { position:relative; margin-bottom:3px; padding-left:4px; }
.detail-list li::before { content:''; position:absolute; left:-14px; top:9px; width:5px; height:5px; border-radius:50%; background:var(--p); opacity:.6; }
.poi-item { cursor:pointer; transition:color .2s; }
.poi-item:hover { color:var(--a); }
.poi-coords { font-size:.65rem; color:var(--tm); opacity:.8; font-family:monospace; margin-left:4px; }
.btn-maps { display:inline-flex; align-items:center; gap:8px; margin-top:12px; padding:10px 16px; background:linear-gradient(135deg,var(--s),#0077b6); color:#fff; text-decoration:none; border-radius:var(--rs); font-size:.76rem; font-weight:600; transition:all .25s; box-shadow:0 2px 12px rgba(0,180,216,.25); border:none; cursor:pointer; }
.btn-maps:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,180,216,.35); filter:brightness(1.1); }
.btn-maps svg { width:14px; height:14px; }

/* Expanded details */
.day-expanded { display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--b); animation:dR .35s cubic-bezier(.22,1,.36,1); }
.day-card.expanded .day-expanded { display:block; }
.expanded-section { margin-bottom:16px; }
.expanded-section:last-child { margin-bottom:0; }
.expanded-title { font-family:'Space Grotesk',sans-serif; font-size:.72rem; font-weight:700; color:var(--a); text-transform:uppercase; letter-spacing:.8px; margin-bottom:10px; }
.expanded-list { display:flex; flex-direction:column; gap:8px; }
.expanded-item { padding:10px 12px; background:rgba(65,90,119,.1); border:1px solid var(--b); border-radius:var(--rs); transition:all .2s; cursor:pointer; }
.expanded-item:hover { border-color:var(--bh); background:rgba(65,90,119,.15); }
.expanded-item-name { font-size:.82rem; font-weight:600; color:var(--t); margin-bottom:4px; line-height:1.3; display:flex; align-items:center; gap:6px; }
.expanded-item-desc { font-size:.74rem; color:var(--tm); line-height:1.6; }
.expanded-item-coords { font-family:monospace; font-size:.68rem; color:var(--tm); opacity:.7; margin-top:4px; }
.btn-expand { display:inline-flex; align-items:center; gap:6px; margin-top:10px; padding:8px 14px; background:rgba(255,186,8,.1); border:1px solid rgba(255,186,8,.2); border-radius:var(--rs); font-size:.74rem; color:var(--a); font-weight:600; cursor:pointer; transition:all .2s; font-family:'Inter',sans-serif; }
.btn-expand:hover { background:rgba(255,186,8,.2); border-color:rgba(255,186,8,.4); transform:translateY(-1px); }
.btn-expand svg { transition:transform .25s; }
.day-card.expanded .btn-expand svg { transform:rotate(180deg); }

/* Locate Me Button */
.locate-btn {
    position: absolute;
    bottom: 28px;
    left: calc(var(--sw) + 28px);
    z-index: 5;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid var(--b);
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: var(--t);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--sh);
    transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    overflow: visible;
}
.locate-btn:hover {
    border-color: var(--s);
    box-shadow: 0 0 20px rgba(0, 180, 216, 0.3), var(--sh);
    transform: scale(1.08);
    color: var(--s);
}
.locate-btn:active { transform: scale(0.95); }
.locate-btn svg { width: 20px; height: 20px; transition: transform 0.3s; }
.locate-btn:hover svg { transform: rotate(15deg); }
.locate-btn.loading svg { animation: spin 0.8s linear infinite; }
.locate-pulse {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid var(--s);
    opacity: 0;
    transform: scale(0.8);
    pointer-events: none;
}
.locate-btn.loading .locate-pulse {
    animation: locatePulse 1.2s ease-out infinite;
}
@keyframes locatePulse {
    0% { opacity: 0.6; transform: scale(0.9); }
    100% { opacity: 0; transform: scale(1.4); }
}

/* Map */
.map-wrapper { flex:1; position:relative; background:#0d1117; min-width:0; overflow:hidden; }
#map { width:100%; height:100%; }

/* Legend — MOVED TO LEFT */
.legend-panel { position:absolute; bottom:28px; left:28px; background:var(--glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--b); border-radius:var(--r); padding:16px 18px; z-index:5; box-shadow:var(--sh); min-width:210px; max-width:260px; transition:all .3s; }
.legend-panel:hover { border-color:var(--bh); box-shadow:var(--sh),var(--sg); }
.legend-title { font-family:'Space Grotesk',sans-serif; font-size:.72rem; font-weight:700; margin-bottom:10px; color:var(--a); text-transform:uppercase; letter-spacing:1px; }
.legend-item { display:flex; align-items:center; gap:10px; font-size:.74rem; color:var(--t); margin-bottom:7px; }
.legend-item:last-child { margin-bottom:0; }
.legend-icon { width:18px; height:18px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:.6rem; font-weight:800; color:#fff; box-shadow:0 2px 6px rgba(0,0,0,.3); }
.legend-stop { background:linear-gradient(135deg,var(--ko),#ff6b6b); }
.legend-camp { background:linear-gradient(135deg,var(--ok),#1dd1a1); }
.legend-line { width:22px; height:3px; background:linear-gradient(90deg,var(--p),var(--a)); border-radius:3px; opacity:.9; flex-shrink:0; box-shadow:0 0 8px rgba(244,140,6,.3); }
.legend-view { background:linear-gradient(135deg,#9b5de5,#f15bb5); }

/* Stats */
.stats-bar { position:absolute; top:20px; left:50%; transform:translateX(-50%); display:flex; gap:clamp(16px,2.5vw,32px); background:var(--glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--b); border-radius:var(--r); padding:12px 28px; z-index:5; box-shadow:var(--sh); transition:all .3s; }
.stats-bar:hover { border-color:var(--bh); }
.stat-item { text-align:center; min-width:56px; position:relative; }
.stat-item:not(:last-child)::after { content:''; position:absolute; right:-8px; top:15%; bottom:15%; width:1px; background:var(--b); }
.stat-icon { width:18px; height:18px; margin:0 auto 4px; opacity:.7; }
.stat-value { font-family:'Space Grotesk',sans-serif; font-size:clamp(1rem,1.3vw,1.3rem); font-weight:700; color:var(--a); line-height:1; }
.stat-label { font-size:.58rem; color:var(--tm); text-transform:uppercase; letter-spacing:.8px; margin-top:3px; font-weight:500; }

/* Mobile overlay */
.mobile-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); z-index:9; opacity:0; transition:opacity .35s ease; pointer-events:none; }
.mobile-overlay.visible { opacity:1; pointer-events:auto; }

/* Mobile toggle */
.mobile-toggle { display:none; position:absolute; bottom:28px; left:28px; z-index:6; background:linear-gradient(135deg,var(--pd),var(--p)); color:#fff; border:none; padding:14px 20px; border-radius:var(--rs); font-weight:700; font-size:.85rem; cursor:pointer; box-shadow:var(--sh),0 0 20px rgba(244,140,6,.3); align-items:center; gap:10px; transition:all .25s; font-family:'Inter',sans-serif; }
.mobile-toggle:hover { transform:translateY(-2px); box-shadow:var(--sh),0 0 30px rgba(244,140,6,.4); }
.mobile-toggle svg { width:18px; height:18px; }

/* InfoWindow */
.gm-style .gm-style-iw-c { background:var(--card)!important; color:var(--t)!important; border-radius:var(--r)!important; padding:0!important; box-shadow:var(--sh),0 0 40px rgba(0,0,0,.4)!important; border:1px solid var(--b)!important; overflow:hidden!important; }
.gm-style .gm-style-iw-d { overflow:hidden!important; padding:0!important; }
.gm-style .gm-style-iw-t::after { background:var(--card)!important; }
.gm-style .gm-ui-hover-effect { display: none !important; }
.iw-content { padding:18px 20px; max-width:300px; }
.iw-header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.iw-badge { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; background:linear-gradient(135deg,var(--p),var(--a)); border-radius:8px; font-size:.75rem; font-weight:800; color:#fff; }
.iw-title-group { flex:1; }
.iw-title { font-family:'Space Grotesk',sans-serif; font-size:.95rem; font-weight:700; color:var(--t); line-height:1.3; }
.iw-day { font-size:.65rem; color:var(--p); font-weight:700; text-transform:uppercase; letter-spacing:.8px; }
.iw-section { margin-bottom:10px; }
.iw-section-title { display:flex; align-items:center; gap:6px; font-size:.65rem; font-weight:700; color:var(--tm); text-transform:uppercase; letter-spacing:.8px; margin-bottom:5px; }
.iw-list { font-size:.78rem; color:var(--t); line-height:1.6; padding-left:16px; margin:0; }
.iw-list li { margin-bottom:2px; }
.iw-link { display:inline-flex; align-items:center; gap:6px; margin-top:10px; padding:8px 14px; background:rgba(0,180,216,.1); border:1px solid rgba(0,180,216,.2); border-radius:8px; font-size:.74rem; color:var(--s); text-decoration:none; font-weight:600; transition:all .2s; }
.iw-link:hover { background:rgba(0,180,216,.2); border-color:rgba(0,180,216,.4); }
.iw-link svg { width:13px; height:13px; }
.iw-coords { font-family:monospace; font-size:.7rem; color:var(--tm); margin-top:4px; }
.iw-image-header { position:relative; height:130px; margin:-22px -20px 14px -20px; border-radius:18px 18px 0 0; overflow:hidden; background-size:cover; background-position:center; }
.iw-image-header::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(10,14,23,.25) 0%,rgba(10,14,23,.9) 100%); }
.iw-image-header-content { position:absolute; bottom:0; left:0; right:0; padding:14px 18px; z-index:2; display:flex; align-items:center; gap:10px; }
.iw-image-header-content .iw-badge { flex-shrink:0; }
.iw-image-header-content .iw-title-group { flex:1; min-width:0; }
.iw-image-header-content .iw-title { color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.7); }
.iw-image-header-content .iw-day { color:var(--a); text-shadow:0 1px 4px rgba(0,0,0,.6); }
.iw-close-btn { position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%; background:rgba(10,14,23,0.75); border:1px solid rgba(255,255,255,0.15); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:10; box-shadow:0 2px 8px rgba(0,0,0,0.4); transition:all 0.2s ease; }
.iw-close-btn:hover { background:rgba(239,71,111,0.9); transform:scale(1.1); }
.iw-close-btn svg { width:14px; height:14px; }


/* Loader */
.map-loader { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--bg); z-index:20; transition:opacity .6s ease; }
.map-loader.hidden { opacity:0; pointer-events:none; }
.loader-brand { display:flex; align-items:center; gap:14px; margin-bottom:28px; }

.loader-brand-text { font-family:'Space Grotesk',sans-serif; font-size:1.3rem; font-weight:700; color:var(--t); }

@keyframes lS { 0%{transform:translateX(-120%)} 100%{transform:translateX(300%)} }
.loader-text { margin-top:16px; font-size:.78rem; color:var(--tm); letter-spacing:.5px; }

  .map-wrapper { height:100vh; }

}

/* Small mobile */

let map, polyline, segments=[], markers=[], infoWindows=[];
let activeDay=null;
let filters={attractions:true,camping:true,route:true,viewpoints:true};
let isMobile=window.innerWidth<=768;

function initApp(){
  renderSidebar();
  loadGoogleMaps();
  setupResizeListener();
  setupMobileDrag();
}

function loadGoogleMaps(){
  if(GOOGLE_MAPS_API_KEY==='INSERISCI_QUI_LA_TUA_API_KEY'){
    document.getElementById('mapLoader').innerHTML='<div style="text-align:center;max-width:400px;padding:20px;"><div style="font-size:2rem;margin-bottom:12px;">🔑</div><div style="font-weight:700;color:var(--a);margin-bottom:8px;">API Key Mancante</div><div style="font-size:.8rem;color:var(--tm);line-height:1.5;">Modifica la costante <code style="background:var(--card);padding:2px 6px;border-radius:4px;">GOOGLE_MAPS_API_KEY</code> nel codice sorgente con la tua chiave Google Maps.<br><br><a href="https://developers.google.com/maps/documentation/javascript/get-api-key" target="_blank" style="color:var(--s);">Ottieni una chiave gratuita →</a></div></div>';
    return;
  }
  const s=document.createElement('script');
  s.src='https://maps.googleapis.com/maps/api/js?key='+GOOGLE_MAPS_API_KEY+'&callback=initMap';
  s.async=true; s.defer=true;
  s.onerror=function(){
    document.getElementById('mapLoader').innerHTML='<div style="text-align:center;color:var(--ko);"><div style="font-size:2rem;margin-bottom:8px;">⚠️</div><div>Errore caricamento Google Maps.<br>Verifica la tua API Key.</div></div>';
  };
  document.head.appendChild(s);
}

function initMap(){
  map=new google.maps.Map(document.getElementById('map'),{
    center:{lat:36.5,lng:-115},zoom:6,mapTypeId:'hybrid',
    mapTypeControl:true,mapTypeControlOptions:{position:google.maps.ControlPosition.TOP_LEFT,style:google.maps.MapTypeControlStyle.DEFAULT},
    fullscreenControl:true,streetViewControl:false,zoomControl:true,zoomControlOptions:{position:google.maps.ControlPosition.RIGHT_CENTER},
    gestureHandling:'greedy',
    styles:[{elementType:'labels.text.fill',stylers:[{color:'#f0f2f5'}]},{elementType:'labels.text.stroke',stylers:[{color:'#0d1b2a'}]}]
  });
  buildRoute();
  buildMarkers();
  fitBounds();
  const savedPos = localStorage.getItem('usaroadtrip_lastpos');
  if(savedPos){
    try{ showUserPosition(JSON.parse(savedPos)); }catch(e){}
  }
  document.getElementById('mapLoader').classList.add('hidden');
}

function buildRoute(){
  const path=itinerary.map(d=>d.coords);
  polyline=new google.maps.Polyline({
    path:path,geodesic:true,strokeColor:'#e85d04',strokeOpacity:.25,strokeWeight:3,map:map
  });
  for(let i=0;i<itinerary.length-1;i++){
    const seg=new google.maps.Polyline({
      path:[itinerary[i].coords,itinerary[i+1].coords],
      geodesic:true,strokeColor:'#e85d04',strokeOpacity:.8,strokeWeight:4,map:map,
      zIndex:10
    });
    segments.push({polyline:seg,from:itinerary[i].day,to:itinerary[i+1].day});
  }
}

function highlightSegment(dayNum){
  segments.forEach(seg=>{
    const isActive=seg.from===dayNum;
    seg.polyline.setOptions({
      strokeOpacity:isActive?1:.15,
      strokeWeight:isActive?5:3,
      strokeColor:isActive?'#ffba08':'#e85d04',
      zIndex:isActive?20:10
    });
  });
}

function resetSegments(){
  segments.forEach(seg=>{
    seg.polyline.setOptions({strokeOpacity:.8,strokeWeight:4,strokeColor:'#e85d04',zIndex:10});
  });
}

function buildMarkers(){
  itinerary.forEach((day,idx)=>{
    const stopMarker=new google.maps.Marker({
      position:day.coords,map:map,title:'Giorno '+day.day+': '+day.title,
      icon:createNumberedPin(day.day,'#e63946'),zIndex:100+idx
    });
    const stopIW=new google.maps.InfoWindow({content:buildInfoWindowContent(day,'stop')});
    stopMarker.addListener('click',()=>{
      closeAllInfoWindows();
      stopIW.open(map,stopMarker);
      selectDay(day.day);
    });
    markers.push({marker:stopMarker,type:'stop',day:day.day});
    infoWindows.push(stopIW);

    if(day.campingCoords){
      const campMarker=new google.maps.Marker({
        position:day.campingCoords,map:map,title:'Campeggio Giorno '+day.day,
        icon:createCampingPin(),zIndex:50+idx
      });
      const campIW=new google.maps.InfoWindow({content:buildInfoWindowContent(day,'camp')});
      campMarker.addListener('click',()=>{
        closeAllInfoWindows();
        campIW.open(map,campMarker);
        selectDay(day.day);
      });
      markers.push({marker:campMarker,type:'camping',day:day.day});
      infoWindows.push(campIW);
    }

    if(day.attractions){
      day.attractions.forEach((attr, aidx)=>{
        if(!attr.coords) return;
        const isView = attr.type === 'viewpoint';
        const poiMarker = new google.maps.Marker({
          position: attr.coords,
          map: map,
          title: attr.name,
          icon: isView ? createViewpointPin() : createPOIPin(),
          zIndex: 200 + idx * 10 + aidx
        });
        const poiIW = new google.maps.InfoWindow({content: buildPOIInfoWindow(attr, day.day)});
        poiMarker.addListener('click', ()=>{
          closeAllInfoWindows();
          poiIW.open(map, poiMarker);
          selectDay(day.day);
        });
        markers.push({marker: poiMarker, type: isView ? 'viewpoint' : 'poi', day: day.day});
        infoWindows.push(poiIW);
      });
    }
  });
}

function createNumberedPin(number,color){
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="36" height="48" viewBox="0 0 36 48"><defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,.4)"/></filter></defs><path d="M18 0C8.06 0 0 8.06 0 18c0 13.5 18 30 18 30s18-16.5 18-30C36 8.06 27.94 0 18 0z" fill="'+color+'" filter="url(#s)"/><circle cx="18" cy="18" r="14" fill="white"/><text x="18" y="23" text-anchor="middle" font-size="14" font-weight="800" fill="'+color+'">'+number+'</text></svg>';
  return {url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg),scaledSize:new google.maps.Size(36,48),anchor:new google.maps.Point(18,48)};
}

  return {url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg),scaledSize:new google.maps.Size(28,28),anchor:new google.maps.Point(14,14)};

function buildPOIInfoWindow(attr, dayNum){
  const mapsUrl = 'https://www.google.com/maps/dir/?api=1&destination='+attr.coords.lat+','+attr.coords.lng;
  let content = '<div class="iw-content">';
  if(attr.image){
    content += `<div class="iw-image-header" style="background-image:url('${attr.image}')">`;
    content += '<button class="iw-close-btn" onclick="event.stopPropagation(); closeAllInfoWindows();" title="Chiudi">';
    content += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    content += '</button>';
    content += '<div class="iw-image-header-content">';
    content += '<div class="iw-badge" style="background:linear-gradient(135deg,#9b5de5,#f15bb5);">📍</div>';
    content += '<div class="iw-title-group">';
    content += '<div class="iw-title">' + attr.name + '</div>';
    content += '<div class="iw-day">Giorno ' + dayNum + ' · ' + (attr.type==='viewpoint'?'Vista Panoramica':'Attrazione') + '</div>';
    content += '</div></div></div>';
  } else {
    content += '<div class="iw-header"><div class="iw-badge" style="background:linear-gradient(135deg,#9b5de5,#f15bb5);">📍</div><div class="iw-title-group">';
    content += '<div class="iw-title">' + attr.name + '</div>';
    content += '<div class="iw-day">Giorno ' + dayNum + ' · ' + (attr.type==='viewpoint'?'Vista Panoramica':'Attrazione') + '</div></div></div>';
  }
  if(attr.desc){
    content += '<div class="iw-section"><div class="iw-section-title">ℹ️ Info</div><div style="font-size:.78rem;color:var(--t);line-height:1.5;">' + attr.desc + '</div></div>';
  }
  content += '<div class="iw-coords">📍 ' + attr.coords.lat.toFixed(4) + ', ' + attr.coords.lng.toFixed(4) + '</div>';
  content += '<a class="iw-link" href="' + mapsUrl + '" target="_blank" rel="noopener"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Apri indicazioni su Google Maps</a>';
  content += '</div>';
  return content;
}

function buildInfoWindowContent(day,type){
  const isCamp=type==='camp';
  const mapsUrl='https://www.google.com/maps/dir/?api=1&destination='+day.coords.lat+','+day.coords.lng;
  let content='<div class="iw-content">';
  content+='<div class="iw-header"><div class="iw-badge">'+day.day+'</div><div class="iw-title-group">';
  content+='<div class="iw-title">'+(isCamp?'⛺ ':'')+day.title+'</div>';
  content+='<div class="iw-day">Giorno '+day.day+'</div></div></div>';
  if(!isCamp&&day.attractions&&day.attractions.length){
    content+='<div class="iw-section"><div class="iw-section-title">🎯 Da vedere</div><ul class="iw-list">';
    day.attractions.forEach(a=>{
      const c = a.coords ? ' <span style="font-family:monospace;font-size:.7rem;color:var(--tm);opacity:.7;">('+a.coords.lat.toFixed(4)+', '+a.coords.lng.toFixed(4)+')</span>' : '';
      content+='<li>'+(a.name||a)+c+'</li>';
    });
    content+='</ul></div>';
  }
  if(day.camping){
    const campName = day.camping.name || day.camping;
    content+='<div class="iw-section"><div class="iw-section-title">⛺ Dove dormire</div><ul class="iw-list"><li>'+campName+'</li></ul></div>';
  }
  if(day.driveTime){
    content+='<div class="iw-section"><div class="iw-section-title">🚗 Guida</div><div style="font-size:.78rem;color:var(--t);">'+day.driveTime+(day.distance?' · '+day.distance:'')+'</div></div>';
  }
  content+='<a class="iw-link" href="'+mapsUrl+'" target="_blank" rel="noopener"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Apri indicazioni su Google Maps</a>';
  content+='</div>';
  return content;
}

function closeAllInfoWindows(){ infoWindows.forEach(iw=>iw.close()); }

function fitBounds(){
  const bounds=new google.maps.LatLngBounds();
  itinerary.forEach(d=>{ bounds.extend(d.coords); if(d.campingCoords) bounds.extend(d.campingCoords); });
  map.fitBounds(bounds,{top:60,right:40,bottom:40,left:40});
}

function renderSidebar(){
  const container=document.getElementById('daysList');
  container.innerHTML=itinerary.map((day,idx)=>{
    const campName = day.camping.name || day.camping;
    const img = day.image || '';
    return `
    <div class="day-card" id="day-${day.day}" onclick="selectDay(${day.day})" style="animation-delay:${idx*0.05}s">
      <div class="day-card-image-wrap">
        ${img?`<img src="${img}" alt="${day.title}" class="day-card-image" loading="lazy" onerror="this.style.display='none'">`:''}
        <div class="day-card-image-overlay"></div>
        <div class="day-card-image-top">
          <div class="day-number-badge">${day.day}</div>
        </div>
        <div class="day-card-image-bottom">
          <div class="day-title">${day.title}</div>
          ${day.driveTime?`<div class="day-route">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
            ${day.driveTime}${day.distance?' · '+day.distance:''}
          </div>`:''}
        </div>
      </div>
      <div class="day-card-body">
        <div class="day-tags">
          <span class="tag tag-attr">${day.attractions.length} attrazioni</span>
          <span class="tag tag-camp">⛺ camping</span>
          ${day.driveTime?'<span class="tag tag-drive">on the road</span>':''}
        </div>
        <div class="day-details">
          <div class="detail-section">
            <div class="detail-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
              Da vedere
            </div>
            <ul class="detail-list">
              ${day.attractions.map((a,i)=>{
                const c = a.coords ? `<span class="poi-coords">${a.coords.lat.toFixed(4)}, ${a.coords.lng.toFixed(4)}</span>` : '';
                const click = a.coords ? `onclick="event.stopPropagation(); flyToPOI(${day.day},${i})" class="poi-item"` : '';
                return `<li ${click}>${a.name||a}${c}</li>`;
              }).join('')}
            </ul>
          </div>
          <div class="detail-section">
            <div class="detail-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22l10-18 10 18"/><path d="M7 22v-8h10v8"/></svg>
              Dove dormire
            </div>
            <ul class="detail-list"><li>${campName}</li></ul>
          </div>
          <button class="btn-expand" onclick="toggleExpand(${day.day},event)" id="expand-btn-${day.day}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            Espandi dettagli
          </button>
          <div class="day-expanded" id="expanded-${day.day}">
            <div class="expanded-section">
              <div class="expanded-title">🎯 Dettagli attrazioni</div>
              <div class="expanded-list">
                ${day.attractions.map((a,i)=>`
                  <div class="expanded-item" onclick="event.stopPropagation(); flyToPOI(${day.day},${i})">
                    <div class="expanded-item-name">${a.name||a} ${a.type==='viewpoint'?'👁️':''}</div>
                    <div class="expanded-item-desc">${a.desc||''}</div>
                    ${a.coords?`<div class="expanded-item-coords">📍 ${a.coords.lat.toFixed(5)}, ${a.coords.lng.toFixed(5)}</div>`:''}
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="expanded-section">
              <div class="expanded-title">⛺ Dettagli campeggio</div>
              <div class="expanded-item" style="margin-top:8px;">
                <div class="expanded-item-name">${campName}</div>
                <div class="expanded-item-desc">${day.camping.desc||''}</div>
              </div>
            </div>
          </div>
          <a class="btn-maps" href="https://www.google.com/maps/dir/?api=1&destination=${day.coords.lat},${day.coords.lng}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Apri su Google Maps
          </a>
        </div>
      </div>

  `}).join('');
}

function selectDay(dayNum){
  const day=itinerary.find(d=>d.day===dayNum);
  if(!day||!map) return;
  highlightDay(dayNum);
  updateProgress(dayNum);
  map.panTo(day.coords);
  map.setZoom(11);
  highlightSegment(dayNum);
  const markerEntry=markers.find(m=>m.day===dayNum&&m.type==='stop');
  if(markerEntry){
    const idx=markers.indexOf(markerEntry);
    const iw=infoWindows[idx];
    if(iw){ closeAllInfoWindows(); iw.open(map,markerEntry.marker); }
  }
  if(isMobile) closeSidebar();
}

function highlightDay(dayNum){
  document.querySelectorAll('.day-card').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('day-'+dayNum);
  if(el){
    el.classList.add('active');
    el.scrollIntoView({behavior:'smooth',block:'center'});
  }
  activeDay=dayNum;
}

function updateProgress(dayNum){
  const pct=(dayNum/itinerary.length)*100;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressDays').textContent='Giorno '+dayNum+' di '+itinerary.length;
}

function toggleExpand(dayNum,event){
  event.stopPropagation();
  const card=document.getElementById('day-'+dayNum);
  const btn=document.getElementById('expand-btn-'+dayNum);
  const isExpanded=card.classList.toggle('expanded');
  btn.innerHTML=isExpanded
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>Comprimi dettagli'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>Espandi dettagli';
  if(isExpanded){
    setTimeout(()=>{
      const expanded=document.getElementById('expanded-'+dayNum);
      if(expanded) expanded.scrollIntoView({behavior:'smooth',block:'nearest'});
    },50);
  }
}

function toggleFilter(chip,filterType){
  const checkbox=chip.querySelector('input');
  checkbox.checked=!checkbox.checked;
  chip.classList.toggle('active',checkbox.checked);
  filters[filterType]=checkbox.checked;
  applyFilters();
}

function applyFilters(){
  if(!map) return;
  if(polyline) polyline.setMap(filters.route?map:null);
  segments.forEach(seg=>seg.polyline.setMap(filters.route?map:null));
  markers.forEach(({marker,type})=>{
    let show=true;
    if(type==='camping') show=filters.camping;
    else if(type==='stop') show=filters.attractions;
    else if(type==='viewpoint') show=filters.viewpoints;
    else if(type==='poi') show=filters.attractions;
    marker.setMap(show?map:null);
  });
}

function toggleSidebar(){
  const sidebar=document.getElementById('sidebar');
  const overlay=document.getElementById('mobileOverlay');
  const isOpen=sidebar.classList.toggle('open');
  overlay.classList.toggle('visible',isOpen);
}

function closeSidebar(){
  const sidebar=document.getElementById('sidebar');
  const overlay=document.getElementById('mobileOverlay');
  sidebar.classList.remove('open');
  overlay.classList.remove('visible');
}

function setupResizeListener(){
  let resizeTimer;
  window.addEventListener('resize',()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{
      const newIsMobile=window.innerWidth<=768;
      if(newIsMobile!==isMobile){
        isMobile=newIsMobile;
        if(!isMobile){
          closeSidebar();
          document.getElementById('sidebar').style.transform='';
        }
      }
      if(map) google.maps.event.trigger(map,'resize');
    },200);
  });
}

function setupMobileDrag(){
  const sidebar=document.getElementById('sidebar');
  const header=document.getElementById('sidebarHeader');
  let startY,startTransform,isDragging=false;

  function onStart(y){
    if(window.innerWidth>768) return;
    isDragging=true;
    startY=y;
    const style=window.getComputedStyle(sidebar);
    const matrix=new WebKitCSSMatrix(style.transform);
    startTransform=matrix.m42;
    sidebar.style.transition='none';
  }
  function onMove(y){
    if(!isDragging) return;
    const delta=y-startY;
    let newY=startTransform+delta;
    const maxOpen=0;
    const maxClosed=sidebar.offsetHeight-60;
    newY=Math.max(maxOpen,Math.min(maxClosed,newY));
    sidebar.style.transform='translateY('+newY+'px)';
  }
  function onEnd(){
    if(!isDragging) return;
    isDragging=false;
    sidebar.style.transition='';
    sidebar.style.transform='';
    const rect=sidebar.getBoundingClientRect();
    const visibleHeight=window.innerHeight-rect.top;
    const threshold=sidebar.offsetHeight*0.4;
    if(visibleHeight>threshold){
      sidebar.classList.add('open');
      document.getElementById('mobileOverlay').classList.add('visible');
    } else {
      sidebar.classList.remove('open');
      document.getElementById('mobileOverlay').classList.remove('visible');
    }
  }

  header.addEventListener('touchstart',e=>onStart(e.touches[0].clientY),{passive:true});
  header.addEventListener('touchmove',e=>onMove(e.touches[0].clientY),{passive:true});
  header.addEventListener('touchend',onEnd);
  header.addEventListener('mousedown',e=>onStart(e.clientY));
  window.addEventListener('mousemove',e=>onMove(e.clientY));
  window.addEventListener('mouseup',onEnd);
}

function flyToPOI(dayNum, attrIdx){
  const day = itinerary.find(d=>d.day===dayNum);
  if(!day || !day.attractions[attrIdx] || !day.attractions[attrIdx].coords) return;
  const attr = day.attractions[attrIdx];
  if(map){
    map.panTo(attr.coords);
    map.setZoom(15);
  }
  const tempIW = new google.maps.InfoWindow({
    content: buildPOIInfoWindow(attr, dayNum),
    position: attr.coords
  });
  closeAllInfoWindows();
  tempIW.open(map);
  infoWindows.push(tempIW);
}

function showUserPosition(loc,accuracy){
  if(!userMarker){
    userMarker = new google.maps.Marker({
      position: loc,
      map: map,
      title: 'La tua posizione',
      icon: createUserLocationPin(),
      zIndex: 1000,
      animation: google.maps.Animation.DROP
    });
    userAccuracyCircle = new google.maps.Circle({
      center: loc,
      radius: accuracy || 50,
      map: map,
      fillColor: '#00b4d8',
      fillOpacity: 0.15,
      strokeColor: '#00b4d8',
      strokeOpacity: 0.4,
      strokeWeight: 1
    });
  } else {
    userMarker.setPosition(loc);
    userAccuracyCircle.setCenter(loc);
    if(accuracy) userAccuracyCircle.setRadius(accuracy);
    userMarker.setAnimation(google.maps.Animation.DROP);
  }
}

function centerOnMe(){
  const btn = document.getElementById('locateBtn');
  const saved = localStorage.getItem('usaroadtrip_lastpos');

  if(saved){
    const pos = JSON.parse(saved);
    showUserPosition(pos);
    map.panTo(pos);
    map.setZoom(14);
    showLocateToast('Posizione caricata dalla memoria');
  }

  if(!navigator.geolocation){
    if(!saved) showLocateToast('Geolocalizzazione non supportata dal browser');
    return;
  }

  btn.classList.add('loading');
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      btn.classList.remove('loading');
      const userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      localStorage.setItem('usaroadtrip_lastpos', JSON.stringify(userLoc));
      localStorage.setItem('usaroadtrip_lastpos_time', Date.now().toString());
      showUserPosition(userLoc, pos.coords.accuracy || 50);
      map.panTo(userLoc);
      map.setZoom(14);
      showLocateToast('Posizione aggiornata!');
    },
    (err)=>{
      btn.classList.remove('loading');
      if(saved) return;
      let msg = 'Errore geolocalizzazione';
      if(err.code === 1) msg = 'Permesso negato. Attiva la geolocalizzazione nelle impostazioni.';
      else if(err.code === 2) msg = 'Posizione non disponibile.';
      else if(err.code === 3) msg = 'Timeout. Riprova.';
      showLocateToast(msg);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
  );
}

let userMarker = null;
let userAccuracyCircle = null;

function createUserLocationPin(){
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#00b4d8" stroke="white" stroke-width="2.5"/><circle cx="12" cy="12" r="4" fill="white"/></svg>';
  return {
    url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
    scaledSize: new google.maps.Size(28, 28),
    anchor: new google.maps.Point(14, 14)
  };
}

function showLocateToast(message){
  let toast = document.getElementById('locateToast');
  if(!toast){
    toast = document.createElement('div');
    toast.id = 'locateToast';
    toast.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--b);color:var(--t);padding:10px 20px;border-radius:12px;font-size:0.78rem;font-weight:600;z-index:100;opacity:0;transition:all 0.35s cubic-bezier(0.22,1,0.36,1);box-shadow:var(--sh);pointer-events:none;white-space:nowrap;';
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  requestAnimationFrame(()=>{
    toast.style.opacity = '1';
    toast.style.transform = 'translateX(-50%) translateY(0)';
  });
  clearTimeout(toast._timer);
  toast._timer = setTimeout(()=>{
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(20px)';
  }, 3000);
}

document.addEventListener('DOMContentLoaded',initApp);
</script>
